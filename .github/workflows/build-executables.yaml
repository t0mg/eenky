name: Build eenky executables

# ── Triggers ──────────────────────────────────────────────────────
on:
  # Manual trigger — used for both nightlies and tagged releases.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version / tag (e.g. 0.2.0, v0.2.0, or leave empty for nightly)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark as pre-release? (auto-defaults to true for nightlies, false for version releases)'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'true', 'false']

  # Automatic trigger on version tags (e.g. v0.1.0)
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Determine release tag, semver version, and pre-release flag.
      - name: Determine release info
        id: release_info
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          INPUT_PRERELEASE="${{ github.event.inputs.prerelease || 'auto' }}"

          if [[ -n "${INPUT_VER}" ]]; then
            # User specified a version / tag in manual dispatch
            SEMVER="${INPUT_VER#v}"
            TAG="v${SEMVER}"
            if [[ "${INPUT_PRERELEASE}" == "auto" ]]; then
              PRERELEASE="false"
            else
              PRERELEASE="${INPUT_PRERELEASE}"
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Triggered by Git tag push (e.g. refs/tags/v0.2.0)
            TAG="${GITHUB_REF#refs/tags/}"
            SEMVER="${TAG#v}"
            if [[ "${INPUT_PRERELEASE}" == "auto" ]]; then
              PRERELEASE="false"
            else
              PRERELEASE="${INPUT_PRERELEASE}"
            fi
          else
            # Nightly build (empty version input or non-tag push)
            DATE_STR=$(date -u +%Y%m%d)
            TAG="eenky-nightly-${DATE_STR}-${{ github.run_number }}"
            BASE_VER=$(node -p "require('./app/package.json').version")
            SEMVER="${BASE_VER}-nightly.${DATE_STR}.${{ github.run_number }}"
            if [[ "${INPUT_PRERELEASE}" == "auto" ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="${INPUT_PRERELEASE}"
            fi
          fi

          echo "tag=${TAG}"               >> "$GITHUB_OUTPUT"
          echo "version=${SEMVER}"         >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release Tag: ${TAG}"
          echo "App Version (SemVer): ${SEMVER}"
          echo "Pre-release: ${PRERELEASE}"

      # Update package.json version so built executables, metadata, and About menu reflect this version
      - name: Update package.json version
        working-directory: ./app
        run: |
          npm version "${{ steps.release_info.outputs.version }}" --no-git-tag-version --allow-same-version
          echo "app/package.json version updated to: $(node -p "require('./package.json').version")"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install SDL2 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install sdl2 sdl3 sdl2_image sdl2_ttf sdl2_gfx

      - name: Install SDL2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev

      - name: Install MSYS2 & SDL2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          release: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_gfx
            mingw-w64-x86_64-cmake

      - name: Add MSYS2 MinGW to PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH
          echo '@echo off' > C:/msys64/mingw64/bin/sdl2-config.bat
          echo 'if "%~1"=="--cflags" echo -IC:/msys64/mingw64/include/SDL2 -Dmain=SDL_main' >> C:/msys64/mingw64/bin/sdl2-config.bat
          echo 'if "%~1"=="--libs" echo -LC:/msys64/mingw64/lib -lmingw32 -lSDL2main -lSDL2' >> C:/msys64/mingw64/bin/sdl2-config.bat

      - name: Install dependencies (App)
        working-directory: ./app
        run: npm install --ignore-scripts

      - name: Build eenk-sim, inkcpp_cl and setup assets
        working-directory: ./app
        run: node ../scripts/setup.js

      - name: Build docs and renderer
        working-directory: ./app
        run: |
          npm run postinstall
          cd renderer
          npm install
          npm run build

      - name: Build eenky
        working-directory: ./app
        run: |
          if [ -n "${{ secrets.CERTIFICATE_OSX_APPLICATION }}" ]; then
            export CSC_LINK="${{ secrets.CERTIFICATE_OSX_APPLICATION }}"
          fi
          if [ -n "${{ secrets.CERTIFICATE_PASSWORD }}" ]; then
            export CSC_KEY_PASSWORD="${{ secrets.CERTIFICATE_PASSWORD }}"
          fi
          npm run dist

      # ── Upload built packages as a GitHub Release ──────────────────────────
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.release_info.outputs.tag }}
          name:       ${{ steps.release_info.outputs.tag }}
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist-eenky/*.zip
            dist-eenky/*.dmg
            dist-eenky/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
