name: Build eenky executables

# ── Triggers ──────────────────────────────────────────────────────
on:
  # Manual trigger — used for both nightlies and tagged releases.
  # (Automated releases are deferred until the binary hand-off from eenk CI
  # is fully wired up. For now, all releases are initiated manually.)
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

  # Automatic trigger on version tags (e.g. v0.1.0)
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Read the version from package.json — this is the single source of truth.
      # On a tag push the version in package.json must already match the tag;
      # on a manual dispatch it is used as-is (nightly / dev build).
      - name: Extract version from package.json
        id: version
        working-directory: ./app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved eenky version: ${VERSION}"

      # Determine release tag and pre-release flag.
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          else
            TAG="eenky-nightly-$(date -u +%Y%m%d)-${{ github.run_number }}"
            PRERELEASE="${{ github.event.inputs.prerelease || 'true' }}"
          fi
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install SDL2 (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install sdl2 sdl2_image sdl2_ttf sdl2_gfx

      - name: Install SDL2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev

      - name: Install MSYS2 & SDL2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          release: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_gfx
            mingw-w64-x86_64-cmake

      - name: Add MSYS2 MinGW to PATH (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH
          echo '@echo off' > C:/msys64/mingw64/bin/sdl2-config.bat
          echo 'if "%~1"=="--cflags" echo -IC:/msys64/mingw64/include/SDL2 -Dmain=SDL_main' >> C:/msys64/mingw64/bin/sdl2-config.bat
          echo 'if "%~1"=="--libs" echo -LC:/msys64/mingw64/lib -lmingw32 -lSDL2main -lSDL2' >> C:/msys64/mingw64/bin/sdl2-config.bat

      - name: Install dependencies (App)
        working-directory: ./app
        run: npm install --ignore-scripts

      - name: Build eenk-sim, inkcpp_cl and setup assets
        working-directory: ./app
        run: node ../scripts/setup.js

      - name: Build docs and renderer
        working-directory: ./app
        run: |
          npm run postinstall
          cd renderer
          npm install
          npm run build

      - name: Build eenky
        working-directory: ./app
        run: |
          if [ -n "${{ secrets.CERTIFICATE_OSX_APPLICATION }}" ]; then
            export CSC_LINK="${{ secrets.CERTIFICATE_OSX_APPLICATION }}"
          fi
          if [ -n "${{ secrets.CERTIFICATE_PASSWORD }}" ]; then
            export CSC_KEY_PASSWORD="${{ secrets.CERTIFICATE_PASSWORD }}"
          fi
          npm run dist

      # ── Upload built packages as a GitHub Release ──────────────────────────
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist-eenky/*.zip
            dist-eenky/*.dmg
            dist-eenky/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
