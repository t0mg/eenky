name: Build eenky executables

# ── Triggers ──────────────────────────────────────────────────────
on:
  # Manual trigger — used for both nightlies and tagged releases.
  # (Automated releases are deferred until the binary hand-off from eenk CI
  # is fully wired up. For now, all releases are initiated manually.)
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

  # Automatic trigger on version tags (e.g. v0.1.0)
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Read the version from package.json — this is the single source of truth.
      # On a tag push the version in package.json must already match the tag;
      # on a manual dispatch it is used as-is (nightly / dev build).
      - name: Extract version from package.json
        id: version
        working-directory: ./app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved eenky version: ${VERSION}"

      # Determine release tag and pre-release flag.
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          else
            TAG="eenky-nightly-$(date -u +%Y%m%d)-${{ github.run_number }}"
            PRERELEASE="${{ github.event.inputs.prerelease || 'true' }}"
          fi
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up app environment
        working-directory: ./app
        run: npm install

      # ── macOS ─────────────────────────────────────────────────────────────
      - name: Build eenky (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./app
        run: |
          npx --yes @electron/packager . eenky \
            --platform=darwin --arch=x64 \
            --app-version="${{ steps.version.outputs.version }}" \
            --icon=../resources/Icon.icns \
            --extend-info=../resources/info.plist \
            --app-bundle-id=com.t0mg.eenky \
            --prune \
            --asar.unpackDir="main-process/ink" \
            --ignore="inklecate_win.exe"
          mkdir -p ReleaseUpload
          ditto -c -k --keepParent eenky-darwin-x64/eenky.app ReleaseUpload/eenky-mac-x64.zip

      # ── Windows ───────────────────────────────────────────────────────────
      - name: Build eenky (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./app
        run: |
          npx --yes @electron/packager . eenky \
            --platform=win32 --arch=x64 \
            --app-version="${{ steps.version.outputs.version }}" \
            --icon=../resources/Icon1024.png.ico \
            --prune \
            --asar.unpackDir="main-process/ink" \
            --ignore="inklecate_mac" \
            --win32metadata.ProductName="eenky" \
            --win32metadata.CompanyName="Tom Granger" \
            --win32metadata.FileDescription="eenky" \
            --win32metadata.OriginalFilename="eenky.exe" \
            --win32metadata.InternalName="eenky"
          mkdir -p ReleaseUpload
          7z a -tzip eenky-win32-x64.zip eenky-win32-x64
          mv eenky-win32-x64.zip ReleaseUpload/eenky-win32-x64.zip

      # ── Linux ─────────────────────────────────────────────────────────────
      - name: Build eenky (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./app
        run: |
          npx --yes @electron/packager . eenky \
            --platform=linux --arch=x64 \
            --app-version="${{ steps.version.outputs.version }}" \
            --icon=../resources/Icon.icns \
            --prune \
            --asar.unpackDir="main-process/ink" \
            --ignore="inklecate_mac"
          mkdir -p ReleaseUpload
          zip -r ReleaseUpload/eenky-linux-x64.zip eenky-linux-x64

      # ── macOS code signing (optional — skipped if secrets are absent) ──────
      - name: Add macOS certificate
        if: matrix.os == 'macos-latest'
        run: |
          if [[ -z "${CERTIFICATE_OSX_APPLICATION}" || -z "${CERTIFICATE_PASSWORD}" ]]; then
            echo "No macOS signing certificate configured — skipping."
            exit 0
          fi
          KEY_CHAIN=build.keychain
          CERTIFICATE_P12=certificate.p12
          echo "${CERTIFICATE_OSX_APPLICATION}" | base64 --decode > "${CERTIFICATE_P12}"
          security create-keychain -p actions "${KEY_CHAIN}"
          security default-keychain -s "${KEY_CHAIN}"
          security unlock-keychain -p actions "${KEY_CHAIN}"
          security import "${CERTIFICATE_P12}" -k "${KEY_CHAIN}" -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "${KEY_CHAIN}"
          rm -f *.p12
        env:
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}

      # ── Upload built packages as a GitHub Release ──────────────────────────
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: app/ReleaseUpload/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
